<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Vehicular Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center p-4 text-zinc-200 font-sans tracking-wide">

  <div class="max-w-3xl w-full bg-zinc-900 rounded-2xl shadow-2xl shadow-black overflow-hidden border border-zinc-800 mt-10 mb-10">
    
    <div class="bg-zinc-950 px-8 py-8 text-center border-b border-zinc-800 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-600 via-amber-400 to-amber-600"></div>
      <h2 class="text-3xl font-bold tracking-widest text-amber-500 uppercase drop-shadow-md">Garage Premium</h2>
      <p class="text-zinc-500 mt-2 text-sm uppercase tracking-widest">Diagnóstico Mecánico con Inteligencia Artificial</p>
    </div>

    <div class="p-8">
      <!-- SECCIÓN DE LOGIN -->
      <div id="login-section" class="space-y-6 max-w-md mx-auto py-10">
        <div class="text-center mb-8">
          <h3 class="text-xl font-light text-zinc-300">Acceso Autorizado</h3>
        </div>
        
        <div class="space-y-5">
          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Correo Electrónico</label>
            <input type="email" id="email" class="w-full px-4 py-3 bg-zinc-950 rounded border border-zinc-800 text-zinc-200 focus:ring-1 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Contraseña</label>
            <input type="password" id="password" class="w-full px-4 py-3 bg-zinc-950 rounded border border-zinc-800 text-zinc-200 focus:ring-1 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
          </div>
        </div>

        <div class="flex gap-4 pt-6">
          <button onclick="signUp()" class="w-full py-3 px-4 bg-zinc-800 text-zinc-400 text-sm font-semibold uppercase tracking-wider rounded hover:bg-zinc-700 hover:text-white transition-colors">Registrarse</button>
          <button onclick="signIn()" class="w-full py-3 px-4 bg-amber-600 text-black text-sm font-bold uppercase tracking-wider rounded hover:bg-amber-500 transition-colors shadow-[0_0_15px_rgba(217,119,6,0.3)]">Ingresar</button>
        </div>
      </div>

      <!-- SECCIÓN PRINCIPAL DE LA APP -->
      <div id="app-section" class="hidden space-y-8">
        <div class="flex justify-between items-center pb-4 border-b border-zinc-800">
          <h3 class="text-lg font-light text-zinc-300 tracking-wide">Evaluación de Vehículo</h3>
          <button onclick="signOut()" class="text-xs px-4 py-2 text-zinc-500 border border-zinc-700 hover:border-red-500 hover:text-red-400 rounded transition-all uppercase tracking-wider">Cerrar Sesión</button>
        </div>

        <div class="flex gap-4 mb-6">
          <label class="flex-1 cursor-pointer group">
            <input type="radio" name="vehicleType" value="Auto" onchange="updateBrands()" class="peer sr-only">
            <div class="text-center py-4 border border-zinc-700 rounded bg-zinc-950 text-zinc-400 peer-checked:border-amber-500 peer-checked:text-amber-400 peer-checked:bg-amber-900/10 transition-all font-semibold uppercase tracking-widest text-sm shadow-inner group-hover:border-zinc-500">
              Automóvil
            </div>
          </label>
          <label class="flex-1 cursor-pointer group">
            <input type="radio" name="vehicleType" value="Moto" onchange="updateBrands()" class="peer sr-only">
            <div class="text-center py-4 border border-zinc-700 rounded bg-zinc-950 text-zinc-400 peer-checked:border-amber-500 peer-checked:text-amber-400 peer-checked:bg-amber-900/10 transition-all font-semibold uppercase tracking-widest text-sm shadow-inner group-hover:border-zinc-500">
              Motocicleta
            </div>
          </label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Marca</label>
            <select id="brand" disabled onchange="updateModels()" class="w-full px-4 py-3 bg-zinc-950 rounded border border-zinc-800 text-zinc-200 focus:ring-1 focus:ring-amber-500 outline-none disabled:opacity-30 appearance-none cursor-pointer">
              <option value="">Selecciona tipo primero...</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Modelo</label>
            <select id="model" disabled onchange="updateYears()" class="w-full px-4 py-3 bg-zinc-950 rounded border border-zinc-800 text-zinc-200 focus:ring-1 focus:ring-amber-500 outline-none disabled:opacity-30 appearance-none cursor-pointer">
              <option value="">Selecciona marca primero...</option>
            </select>
          </div>

          <!-- AÑO ESTRICTO (AHORA ES UN SELECT) -->
          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Año de Fabricación</label>
            <select id="year" disabled class="w-full px-4 py-3 bg-zinc-950 rounded border border-zinc-800 text-amber-500 font-bold focus:ring-1 focus:ring-amber-500 outline-none disabled:opacity-30 disabled:text-zinc-500 appearance-none cursor-pointer text-center">
              <option value="">Selecciona modelo...</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Kilometraje Actual</label>
            <div class="relative">
              <input type="text" id="mileage" oninput="formatMileage(this)" class="w-full px-4 py-3 bg-zinc-950 rounded border border-zinc-800 text-zinc-200 font-mono tracking-widest focus:ring-1 focus:ring-amber-500 outline-none placeholder-zinc-700" placeholder="0">
              <span class="absolute right-4 top-3 text-zinc-600 font-bold text-sm">KM</span>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Reporte del cliente (Opcional)</label>
          <input type="text" id="customQuery" class="w-full px-4 py-3 bg-zinc-950 rounded border border-zinc-800 text-zinc-200 focus:ring-1 focus:ring-amber-500 outline-none placeholder-zinc-700 italic" placeholder="Ej: Ruido extraño al pasar cambios...">
        </div>
        
        <div class="flex gap-4 pt-4 border-t border-zinc-800">
          <button onclick="analizarVehiculo()" class="flex-1 py-4 px-4 bg-zinc-100 text-zinc-900 font-bold uppercase tracking-widest text-sm rounded hover:bg-white transition-colors">Generar Diagnóstico</button>
          <button onclick="guardarVehiculo()" class="flex-1 py-4 px-4 bg-amber-600 text-black font-bold uppercase tracking-widest text-sm rounded hover:bg-amber-500 transition-colors shadow-[0_0_15px_rgba(217,119,6,0.2)]">Guardar en Base</button>
        </div>
        
        <!-- Contenedor del Diagnóstico Visual -->
        <div id="ai-response-container" class="hidden mt-8 border border-zinc-800 rounded-lg overflow-hidden bg-zinc-950">
          <div class="bg-zinc-800/50 px-4 py-3 border-b border-zinc-800 flex justify-between items-center">
            <span class="text-xs font-bold text-zinc-400 uppercase tracking-widest">Reporte Técnico Generado</span>
            <span class="h-2 w-2 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse"></span>
          </div>
          <!-- Aquí se inyectarán las tarjetas de colores -->
          <div id="ai-response" class="p-6"></div>
        </div>
        
        <!-- Vehículos Guardados -->
        <div class="mt-10 pt-8 border-t border-zinc-800">
          <h4 class="text-sm font-semibold text-zinc-500 uppercase tracking-widest mb-5 flex items-center gap-2">
            Historial del Garage
          </h4>
          <ul id="vehicle-list" class="space-y-3"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
